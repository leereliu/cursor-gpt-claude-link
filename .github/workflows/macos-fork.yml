name: macOS fork regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-regressions:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:macos
